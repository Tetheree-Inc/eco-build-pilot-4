<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECO Pilot — Status</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var key = "eco-pilot-theme";
        var stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch (e) {}
        var theme;
        if (stored === "light" || stored === "dark") {
          theme = stored;
        } else {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__brand">
          <h1 id="site-title" class="site-header__title">ECO Pilot</h1>
          <p id="site-tagline" class="site-header__tagline">Pilot status page</p>
        </div>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Switch to dark theme"
          aria-pressed="false"
        >
          <span class="theme-toggle__icon" aria-hidden="true">☾</span>
          <span class="theme-toggle__text">Dark</span>
        </button>
      </div>
      <script>
        (function () {
          var theme = document.documentElement.getAttribute("data-theme");
          if (theme !== "light" && theme !== "dark") {
            return;
          }
          var button = document.getElementById("theme-toggle");
          if (!button) {
            return;
          }
          var next = theme === "light" ? "dark" : "light";
          button.setAttribute(
            "aria-label",
            theme === "light" ? "Switch to dark theme" : "Switch to light theme"
          );
          button.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
          var text = button.querySelector(".theme-toggle__text");
          if (text) {
            text.textContent = next === "dark" ? "Dark" : "Light";
          }
          var icon = button.querySelector(".theme-toggle__icon");
          if (icon) {
            icon.textContent = theme === "light" ? "☾" : "☀";
          }
        })();
      </script>
    </header>

    <main class="site-main">
      <div id="sections-root" class="sections" aria-live="polite">
        <p class="site-main__loading">Loading status…</p>
      </div>

      <section class="changelog" aria-labelledby="changelog-heading">
        <h2 id="changelog-heading" class="changelog__title">Changelog</h2>
        <div id="changelog-root" class="changelog__root">
          <p class="site-main__loading">Loading changelog…</p>
        </div>
      </section>

      <section class="faq" aria-labelledby="faq-heading">
        <h2 id="faq-heading" class="faq__title">FAQ</h2>
        <div id="faq-root" class="faq__root">
          <p class="site-main__loading">Loading FAQ…</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__meta">
          Deployed
          <time id="build-date" datetime="__BUILD_DATE_ISO__">__BUILD_DATE__</time>
          · commit
          <code id="commit-sha">__COMMIT_SHA__</code>
        </p>
      </div>
    </footer>

    <script src="./js/theme.js" defer></script>
    <script src="./js/main.js" defer></script>
  </body>
</html>
